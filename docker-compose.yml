version: "3.9"

# ============================================================
# QuantFlow Terminal — Development Stack
# Usage: docker compose up -d
# ============================================================

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: ../infra/docker/backend.Dockerfile
    target: development
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # --------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB
  # --------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: qf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantflow}
      POSTGRES_USER: ${POSTGRES_USER:-quantflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantflow} -d ${POSTGRES_DB:-quantflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qf-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------
  # RabbitMQ 3.13
  # --------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: qf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quantflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------
  # FastAPI Backend
  # --------------------------------------------------------
  backend:
    <<: *backend-common
    container_name: qf-backend
    ports:
      - "8000:8000"
      - "9090:9090"     # Prometheus metrics
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Celery Worker (options, dealer, research queues)
  # --------------------------------------------------------
  celery-worker:
    <<: *backend-common
    container_name: qf-celery-worker
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=options,dealer,research,flow,earnings,default
      --hostname=worker@%h
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------
  # Celery Beat (scheduler)
  # --------------------------------------------------------
  celery-beat:
    <<: *backend-common
    container_name: qf-celery-beat
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    depends_on:
      - celery-worker

  # --------------------------------------------------------
  # Flower (Celery monitoring UI)
  # --------------------------------------------------------
  flower:
    <<: *backend-common
    container_name: qf-flower
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555
      --broker=${CELERY_BROKER_URL}
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker

  # --------------------------------------------------------
  # Next.js Frontend
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      target: development
    container_name: qf-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  # --------------------------------------------------------
  # Nginx (reverse proxy — optional in dev)
  # --------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: qf-nginx
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    profiles:
      - proxy   # only starts with: docker compose --profile proxy up

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  rabbitmqdata:
    driver: local

networks:
  default:
    name: quantflow-network
