[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantflow-backend"
version = "1.0.0"
description = "QuantFlow Terminal — Institutional Trading & Research Platform"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",

    # Cache / Message queue
    "redis[hiredis]==5.0.4",
    "aio-pika==9.4.1",

    # Task queue
    "celery[redis]==5.4.0",
    "flower==2.0.1",

    # Auth / Security
    "pyjwt[crypto]==2.8.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",

    # Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",

    # Numerical / Quant
    "numpy==1.26.4",
    "scipy==1.13.0",
    "pandas==2.2.2",
    "polars==0.20.23",
    "numba==0.59.1",

    # ML / HMM
    "hmmlearn==0.3.2",
    "scikit-learn==1.4.2",

    # HTTP client
    "httpx==0.27.0",
    "aiohttp==3.9.5",

    # Serialization
    "orjson==3.10.3",
    "msgpack==1.0.8",

    # Observability
    "structlog==24.1.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-instrumentation-fastapi==0.45b0",

    # Utilities
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
    "anyio==4.3.0",
    "arrow==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.0.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["app"]
