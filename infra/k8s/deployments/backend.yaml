apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantflow-backend
  namespace: quantflow
  labels:
    app: quantflow-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantflow-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantflow-backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: quantflow/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: APP_ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantflow-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantflow-secrets
                  key: redis-password
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantflow-secrets
                  key: rabbitmq-password
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantflow-secrets
                  key: polygon-api-key
          envFrom:
            - configMapRef:
                name: quantflow-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: quantflow-jwt-keys
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [quantflow-backend]
                topologyKey: kubernetes.io/hostname
